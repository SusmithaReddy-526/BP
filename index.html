!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Blood Pressure Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Simulate a blood pressure and heart rate measurement by placing your finger on the scanner.">
</head>
<body>
    <div class="app-wrapper">
        <div class="scanner-card">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-activity"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </div>
                <h1>Vitals Scanner</h1>
                <p>Smart Blood Pressure & Heart Rate Monitor</p>
            </div>

            <div class="instruction-box" id="instructionBox">
                <span id="statusMessage">Place and hold your finger to scan</span>
            </div>

            <div class="scanner-container">
                <div class="scanner-ring" id="scannerRing">
                    <button class="scanner-btn" id="scannerBtn" aria-label="Start Scanner">
                        <svg class="fingerprint-icon" xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
                            <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
                            <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
                            <path d="M2 12a10 10 0 0 1 18-6"/>
                            <path d="M2 16h.01"/>
                            <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
                            <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
                            <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
                            <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
                        </svg>
                        
                        <!-- Scanning effects -->
                        <div class="scan-line" id="scanLine"></div>
                        <div class="particles" id="particles"></div>
                    </button>
                    <!-- Pulse rings for scanning effect -->
                    <div class="pulse pulse-1"></div>
                    <div class="pulse pulse-2"></div>
                </div>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <div class="results-container hidden" id="resultsContainer">
                <div class="metrics-grid">
                    <div class="metric-card sys-dia">
                        <div class="metric-header">Blood Pressure</div>
                        <div class="metric-value">
                            <span id="sysValue" class="value sys">--</span>
                            <span class="separator">/</span>
                            <span id="diaValue" class="value dia">--</span>
                            <span class="unit">mmHg</span>
                        </div>
                        <div class="metric-status" id="bpStatus">
                            <span class="status-indicator"></span>
                            <span class="status-text">Analyzing...</span>
                        </div>
                    </div>
                    
                    <div class="metric-card hr">
                        <div class="metric-header">Heart Rate</div>
                        <div class="metric-value">
                            <span id="hrValue" class="value hr-val">--</span>
                            <span class="unit">bpm</span>
                        </div>
                        <div class="metric-status normal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="heart-icon"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                            <span class="status-text">Regular</span>
                        </div>
                    </div>
                </div>
                
                <button class="reset-btn" id="resetBtn">
                    <span>Scan Again</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
